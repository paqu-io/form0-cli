name: Publish Package

on:
  release:
    types:
      - published

# Add permissions block at the top level of the workflow
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        run: |
          release_version="${GITHUB_REF#refs/tags/}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${release_version#v}" != "$package_version" ]]; then
            echo "Release tag $release_version does not match package version $package_version."
            exit 1
          fi
          echo "VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Run release checks
        run: npm run release:check

      - name: Determine npm distribution tag
        id: check_version
        run: |
          if [[ ! "${{ env.VERSION }}" =~ - ]]; then
            echo "STABLE=true" >> $GITHUB_ENV
          else
            echo "STABLE=false" >> $GITHUB_ENV
          fi

      # Publish to npm.
      - name: Publish to npm
        run: |
          if [[ "${{ env.STABLE }}" == "true" ]]; then
            npm publish
          else
            npm publish --tag next
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
