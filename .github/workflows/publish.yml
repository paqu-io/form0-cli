name: Publish Package

on:
  release:
    types:
      - published

# Add permissions block at the top level of the workflow
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://npm.pkg.github.com'
          scope: '@paqu-io'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Check if version is stable
        id: check_version
        run: |
          if [[ ! "${{ env.VERSION }}" =~ - ]]; then
            echo "STABLE=true" >> $GITHUB_ENV
          else
            echo "STABLE=false" >> $GITHUB_ENV
          fi

      # ✅ Always publish to GitHub Packages
      - name: Modify package.json for GitHub Packages
        run: |
          if [[ "${{ env.STABLE }}" == "true" ]]; then
            # For stable versions - set public access
            jq '.name = "@paqu-io/form0-cli" | .publishConfig = {"access": "public"}' package.json > temp.json && mv temp.json package.json
          else
            # For non-stable versions - set restricted access
            jq '.name = "@paqu-io/form0-cli" | .publishConfig = {"access": "restricted"}' package.json > temp.json && mv temp.json package.json
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_registry: 'https://npm.pkg.github.com'

      # For npm registry, modify package.json to remove scope
      - name: Modify package.json for npm
        if: env.STABLE == 'true'
        run: |
          jq '.name = "form0-cli" | .publishConfig = {"access": "public"}' package.json > temp.json && mv temp.json package.json

      # For npm registry, we need to switch the configuration
      - name: Setup npm registry
        if: env.STABLE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      # ✅ Only publish stable versions to npm
      - name: Publish to npm
        if: env.STABLE == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
